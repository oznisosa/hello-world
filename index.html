<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner deslizante</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .slider {
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 300px;
        }
        .slides {
            display: flex;
            transition: transform 0.5s ease-in-out;
            width: 300%; /* 3 slides */
        }
        .slide {
            width: 100%;
            flex-shrink: 0;
        }
        .slide img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        .controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
        }
        .controls button {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
        }
        .controls button.active {
            background: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>
    <div class="slider" id="slider">
        <div class="slides">
            <div class="slide"><img src="https://via.placeholder.com/800x300/ff7f7f/333333?text=Imagen+1" alt="Imagen 1"></div>
            <div class="slide"><img src="https://via.placeholder.com/800x300/7f7fff/333333?text=Imagen+2" alt="Imagen 2"></div>
            <div class="slide"><img src="https://via.placeholder.com/800x300/7fff7f/333333?text=Imagen+3" alt="Imagen 3"></div>
        </div>
        <div class="controls">
            <button data-index="0" class="active"></button>
            <button data-index="1"></button>
            <button data-index="2"></button>
        </div>
    </div>

    <script>
        const slides = document.querySelector('.slides');
        const buttons = document.querySelectorAll('.controls button');
        let currentIndex = 0;
        let intervalId;

        function showSlide(index) {
            currentIndex = index;
            const offset = -index * 100;
            slides.style.transform = `translateX(${offset}%)`;
            buttons.forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % 3;
            showSlide(currentIndex);
        }

        function startAutoSlide() {
            intervalId = setInterval(nextSlide, 3000);
        }

        function stopAutoSlide() {
            clearInterval(intervalId);
        }

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                stopAutoSlide();
                showSlide(parseInt(button.dataset.index));
                startAutoSlide();
            });
        });

        startAutoSlide();
    </script>
</body>
</html>
